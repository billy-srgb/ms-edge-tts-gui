[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgettsgui"
dynamic = ["version"]
description = "Desktop client for Microsoft Edge text-to-speech"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "edgettsgui.config.APP_VERSION"}
