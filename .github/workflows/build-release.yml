name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 写入版本号
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          python -c "import pathlib,re; version='$VERSION'; p=pathlib.Path('src/edgettsgui/config.py'); t=p.read_text(encoding='utf-8'); t,n=re.subn(r'APP_VERSION = \"[^\"]*\"', f'APP_VERSION = \"{version}\"', t, count=1); assert n==1; p.write_text(t, encoding='utf-8')"

      - name: 打包 Windows
        run: scripts\windows.bat

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdgeTTSGui/EdgeTTSGui.exe
            dist/EdgeTTSGui-Portable.exe
            dist/EdgeTTSGui-Setup.exe
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 写入版本号
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          python -c "import pathlib,re; version='$VERSION'; p=pathlib.Path('src/edgettsgui/config.py'); t=p.read_text(encoding='utf-8'); t,n=re.subn(r'APP_VERSION = \"[^\"]*\"', f'APP_VERSION = \"{version}\"', t, count=1); assert n==1; p.write_text(t, encoding='utf-8')"

      - name: 打包 macOS
        run: bash scripts/macos.sh

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EdgeTTSGui-macOS-*.dmg
          generate_release_notes: false

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtk8.6 tcl8.6 tk8.6 \
            libsdl2-2.0-0 libsdl2-mixer-2.0-0 \
            libasound2 \
            squashfs-tools \
            dpkg-dev fakeroot \
            curl ca-certificates file

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 确认 tkinter 可用
        run: python -c "import tkinter; print('tkinter ok', tkinter.TkVersion)"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 写入版本号
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          python -c "import pathlib,re; version='$VERSION'; p=pathlib.Path('src/edgettsgui/config.py'); t=p.read_text(encoding='utf-8'); t,n=re.subn(r'APP_VERSION = \"[^\"]*\"', f'APP_VERSION = \"{version}\"', t, count=1); assert n==1; p.write_text(t, encoding='utf-8')"

      - name: 打包 Linux
        run: |
          export VERSION="${APP_VERSION}"
          bash scripts/linux.sh

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdgeTTSGui-linux-*.deb
            dist/EdgeTTSGui-linux-*.AppImage
          generate_release_notes: false
