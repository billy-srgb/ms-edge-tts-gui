name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 写入版本号
        shell: bash
        run: |
          VERSION="$(python scripts/set_version.py "${GITHUB_REF_NAME}")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: PyInstaller 打包（目录版，供安装器使用）
        run: pyinstaller --noconfirm --clean --onedir --windowed --name EdgeTTSGui --icon assets/app.ico --hidden-import docx --hidden-import pypdf --hidden-import certifi --collect-data certifi --collect-all customtkinter app.py

      - name: PyInstaller 打包（便携单文件版）
        run: pyinstaller --noconfirm --clean --onefile --windowed --name EdgeTTSGui-Portable --icon assets/app.ico --hidden-import docx --hidden-import pypdf --hidden-import certifi --collect-data certifi --collect-all customtkinter app.py

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 编译安装程序
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { $iscc = Get-ChildItem "C:\Program Files\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer\EdgeTTSGui.iss
          Get-ChildItem dist | Select-Object Name, Length

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdgeTTSGui/EdgeTTSGui.exe
            dist/EdgeTTSGui-Portable.exe
            dist/EdgeTTSGui-Setup.exe
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 写入版本号
        run: |
          VERSION="$(python scripts/set_version.py "${GITHUB_REF_NAME}")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: PyInstaller 打包 .app
        run: bash scripts/build_app.sh

      - name: 生成 DMG
        run: bash scripts/pack_macos_dmg.sh

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EdgeTTSGui-macOS-*.dmg
          generate_release_notes: false

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtk8.6 tcl8.6 tk8.6 \
            libsdl2-2.0-0 libsdl2-mixer-2.0-0 \
            libasound2 \
            squashfs-tools \
            dpkg-dev fakeroot \
            curl ca-certificates file

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 确认 tkinter 可用
        run: python -c "import tkinter; print('tkinter ok', tkinter.TkVersion)"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 写入版本号
        run: |
          VERSION="$(python scripts/set_version.py "${GITHUB_REF_NAME}")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: PyInstaller 打包
        run: bash scripts/build_app.sh

      - name: 生成 .deb 与 AppImage
        run: |
          export VERSION="${APP_VERSION}"
          bash scripts/pack_linux.sh

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdgeTTSGui-linux-*.deb
            dist/EdgeTTSGui-linux-*.AppImage
          generate_release_notes: false
